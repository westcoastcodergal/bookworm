<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy for XSS protection -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   img-src 'self' data: https://books.google.com https://covers.openlibrary.org http://books.google.com http://covers.openlibrary.org;
                   connect-src 'self' https://www.googleapis.com https://openlibrary.org;
                   font-src 'self' https://fonts.gstatic.com;
                   object-src 'none';
                   base-uri 'self';
                   form-action 'self';">

    <title>Bookworm - Book Recommendations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Fredoka:wght@300;400;500;600;700&family=Lobster&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Bookworm</h1>
            <p class="tagline">Discover your next great read</p>
        </header>

        <main>
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="search">Search Books</button>
                <button class="tab-btn" data-tab="library">My Library</button>
                <button class="tab-btn" data-tab="recommendations">Recommendations</button>
            </div>

            <!-- Search Books Tab -->
            <div id="search-tab" class="tab-content active">
                <div class="search-section">
                    <input type="text" id="api-search-input" placeholder="Search for any book by title or author...">
                    <button id="search-btn" class="search-btn">Search</button>
                </div>
                <div id="search-status" class="search-status"></div>
                <div id="search-results-grid" class="books-grid"></div>
            </div>

            <!-- My Library Tab -->
            <div id="library-tab" class="tab-content">
                <!-- Library Shelf Section -->
                <div id="library-shelf-section" class="library-shelf-section">
                    <h3 class="library-shelf-title">📖 My Library Shelf</h3>
                    <div id="library-shelf" class="bookshelf"></div>
                </div>

                <!-- Want to Read Section -->
                <div id="want-to-read-section" class="want-to-read-section">
                    <h3 class="want-to-read-title">📚 Want to Read</h3>
                    <div id="want-to-read-shelf" class="bookshelf"></div>
                </div>

                <div id="books-grid" class="books-grid"></div>
            </div>

            <!-- Recommendations Tab -->
            <div id="recommendations-tab" class="tab-content">
                <div class="recommendations-header">
                    <h2>Recommended for You</h2>
                    <p id="rec-description">Rate some books to get personalized recommendations!</p>
                </div>
                <div class="search-section">
                    <select id="rec-genre-filter">
                        <option value="">All Genres</option>
                    </select>
                </div>
                <div id="recommendations-grid" class="books-grid"></div>
            </div>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
