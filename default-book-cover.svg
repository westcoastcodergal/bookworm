<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f4f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a67bf7;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" fill="url(#bg-gradient)"/>

  <!-- Border frame -->
  <rect x="10" y="10" width="280" height="430" fill="none" stroke="#2a2a2a" stroke-width="4" rx="2"/>

  <!-- Decorative corner elements (Picasso-style asymmetry) -->
  <polygon points="30,30 60,30 45,45" fill="#ff6b6b" opacity="0.6" transform="rotate(-5 45 35)"/>
  <polygon points="270,30 240,30 255,45" fill="#4ecdc4" opacity="0.6" transform="rotate(5 255 35)"/>
  <polygon points="30,420 60,420 45,405" fill="#ffd93d" opacity="0.6" transform="rotate(5 45 415)"/>
  <polygon points="270,420 240,420 255,405" fill="#a67bf7" opacity="0.6" transform="rotate(-5 255 415)"/>

  <!-- Abstract geometric shapes (playful design) -->
  <circle cx="80" cy="120" r="25" fill="#ff6b6b" opacity="0.15"/>
  <circle cx="220" cy="150" r="30" fill="#4ecdc4" opacity="0.15"/>
  <rect x="70" y="280" width="40" height="40" fill="#ffd93d" opacity="0.15" transform="rotate(-8 90 300)"/>
  <rect x="190" y="310" width="35" height="35" fill="#a67bf7" opacity="0.15" transform="rotate(12 207 327)"/>

  <!-- Book icon (centered) -->
  <g transform="translate(150, 180)" filter="url(#shadow)">
    <!-- Book pages -->
    <rect x="-45" y="-55" width="90" height="110" fill="#fff" stroke="#2a2a2a" stroke-width="3" rx="2"/>

    <!-- Book spine detail -->
    <line x1="-45" y1="-55" x2="-45" y2="55" stroke="#2a2a2a" stroke-width="3"/>
    <rect x="-50" y="-55" width="10" height="110" fill="url(#accent-gradient)" stroke="#2a2a2a" stroke-width="3" rx="2"/>

    <!-- Page lines -->
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="-15" x2="30" y2="-15" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="15" x2="25" y2="15" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="30" x2="30" y2="30" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text: "No Cover Available" -->
  <text x="150" y="310" font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#2a2a2a" text-anchor="middle" opacity="0.7">
    No Cover
  </text>
  <text x="150" y="332" font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#2a2a2a" text-anchor="middle" opacity="0.7">
    Available
  </text>

  <!-- Bottom decorative line -->
  <line x1="60" y1="370" x2="240" y2="370" stroke="url(#accent-gradient)" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle pattern texture -->
  <g opacity="0.03">
    <circle cx="100" cy="80" r="3" fill="#2a2a2a"/>
    <circle cx="200" cy="100" r="3" fill="#2a2a2a"/>
    <circle cx="120" cy="200" r="3" fill="#2a2a2a"/>
    <circle cx="180" cy="240" r="3" fill="#2a2a2a"/>
    <circle cx="140" cy="360" r="3" fill="#2a2a2a"/>
    <circle cx="90" cy="380" r="3" fill="#2a2a2a"/>
    <circle cx="210" cy="390" r="3" fill="#2a2a2a"/>
  </g>
</svg>
